[project]
name = "k-whisper"
version = "1.1.0"
description = "Desktop app for whisper.cpp: batch transcription into subtitles and transcripts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "PySide6-Essentials>=6.10",
]

[project.scripts]
k-whisper = "k_whisper.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.7",
    "pyinstaller>=6.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k_whisper"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.pyright]
venvPath = "."
venv = ".venv"
